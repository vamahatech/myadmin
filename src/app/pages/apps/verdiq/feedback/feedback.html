<div class="page">
  <app-page-header title="Feedback" description="General feedback parents send from Settings — not tied to any product.">
    <button type="button" class="btn btn-ghost" (click)="load()" [disabled]="loading()"><app-icon name="refresh" [size]="16" /> Refresh</button>
  </app-page-header>

  @if (error()) { <div class="card state error">{{ error() }}</div> }

  @if (data(); as d) {
    <div class="segmented" role="group" aria-label="Filter by status">
      <button type="button" [attr.aria-pressed]="tab === 'new'" (click)="setTab('new')">
        New <span class="segmented__count">{{ d.counts.new }}</span>
      </button>
      <button type="button" [attr.aria-pressed]="tab === 'read'" (click)="setTab('read')">
        Read <span class="segmented__count">{{ d.counts.read }}</span>
      </button>
      <button type="button" [attr.aria-pressed]="tab === 'all'" (click)="setTab('all')">All</button>
    </div>

    @if (loading()) {
      <app-skeleton variant="cards" [count]="4" />
    } @else if (d.rows.length === 0) {
      <div class="card"><app-empty-state icon="message" title="No {{ tab === 'all' ? '' : tab }} feedback" /></div>
    } @else {
      <div class="fb-list">
        @for (f of d.rows; track f.id) {
          <div class="card fb-card">
            <div class="fb-head">
              <span class="pill" [class.yes]="f.status === 'read'" [class.neutral]="f.status === 'new'">{{ f.status }}</span>
              <span class="fb-meta">{{ f.created_at | date:'medium' }} · {{ f.sender_email || 'unknown' }}</span>
            </div>
            <p class="fb-note">{{ f.note }}</p>
            @if (f.status === 'new') {
              <div class="fb-actions">
                <button class="btn btn-ghost" (click)="markRead(f)" [disabled]="busy() === f.id">
                  {{ busy() === f.id ? 'Working…' : 'Mark read' }}
                </button>
              </div>
            }
          </div>
        }
      </div>
    }
  }
</div>
