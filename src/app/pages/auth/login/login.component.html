<main class="min-h-screen bg-bg text-text flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <div class="flex items-center gap-3 mb-10">
      <span class="ink-seal text-primary w-9 h-9 text-lg">V</span>
      <div>
        <p class="text-[11px] uppercase tracking-[0.2em] text-text2">Vamaha Studio — Internal</p>
        <h1 class="text-2xl font-bold leading-tight">Open the ledger</h1>
      </div>
    </div>

    <form (ngSubmit)="submit()" class="space-y-7">
      <div>
        <label for="email" class="block text-xs uppercase tracking-wide text-text2 mb-2">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          autocomplete="username"
          class="w-full px-4 py-3 bg-surface border-2 border-border rounded-xl text-text placeholder:text-text2 focus:outline-none focus:border-primary transition-colors"
          placeholder="you@vamaha.tech"
        />
      </div>

      <div>
        <label for="password" class="block text-xs uppercase tracking-wide text-text2 mb-2">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          class="w-full px-4 py-3 bg-surface border-2 border-border rounded-xl text-text placeholder:text-text2 focus:outline-none focus:border-primary transition-colors"
          placeholder="••••••••"
        />
      </div>

      @if (error()) {
        <p class="text-danger text-sm">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="status() === 'submitting' || !email || !password"
        (click)="stamp()"
        class="w-full flex items-center justify-center gap-3 py-3.5 bg-primary hover:bg-accent disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-2xl transition-colors"
      >
        <span
          class="ink-seal text-white w-5 h-5 text-[10px]"
          [class.ink-seal--pressed]="pressed()"
          (animationend)="pressed.set(false)"
        >V</span>
        {{ status() === 'submitting' ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="text-center text-text2 text-xs mt-8">
      Authorised access only.
    </p>
  </div>
</main>
