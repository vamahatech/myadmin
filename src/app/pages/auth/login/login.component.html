<main class="relative min-h-screen overflow-hidden bg-bg text-text flex items-center justify-center px-6 py-10">
  <img
    src="illustrations/Team goals-rafiki.svg"
    alt=""
    aria-hidden="true"
    class="pointer-events-none absolute bottom-[-4rem] right-[-4rem] w-[min(90vw,38rem)] opacity-[0.12] grayscale"
  />
  <img
    src="illustrations/Team goals-pana.svg"
    alt=""
    aria-hidden="true"
    class="pointer-events-none absolute bottom-[-4rem] left-[-5rem] w-[min(72vw,30rem)] opacity-[0.08] grayscale -scale-x-100"
  />
  <img
    src="illustrations/Webinar-bro.svg"
    alt=""
    aria-hidden="true"
    class="pointer-events-none absolute top-[-6rem] left-[-5rem] w-[min(58vw,24rem)] opacity-[0.07] grayscale rotate-[-8deg]"
  />

  <div class="relative z-10 w-full max-w-sm">
    <section>
      <div class="flex items-center gap-3 mb-10">
        <span class="ink-seal text-primary w-9 h-9 text-lg">V</span>
        <div>
          <p class="text-xs uppercase tracking-[0.2em] text-primary font-bold">Vamaha Studio — Internal</p>
          <h1 class="text-3xl font-extrabold leading-tight text-text">Open the ledger</h1>
        </div>
      </div>

      <form (ngSubmit)="submit()" class="space-y-7">
        <div>
          <label for="email" class="block text-sm font-bold text-text mb-2">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            required
            autocomplete="username"
            class="w-full px-4 py-3 bg-card border-2 border-border rounded-xl text-text placeholder:text-text2 focus:outline-none focus:border-primary transition-colors"
            placeholder="you@vamaha.tech"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-bold text-text mb-2">Password</label>
          <div class="relative">
            <input
              id="password"
              name="password"
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="password"
              required
              autocomplete="current-password"
              class="w-full px-4 py-3 pr-12 bg-card border-2 border-border rounded-xl text-text placeholder:text-text2 focus:outline-none focus:border-primary transition-colors"
              placeholder="••••••••"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-text2 hover:text-text transition-colors"
            >
              <img
                [src]="showPassword() ? 'hidepassword.svg' : 'showpassord.svg'"
                alt=""
                class="w-5 h-5"
              />
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="text-danger text-sm">{{ error() }}</p>
        }

        <button
          type="submit"
          [disabled]="status() === 'submitting' || !email || !password"
          (click)="stamp()"
          class="w-full flex items-center justify-center gap-3 py-3.5 bg-primary hover:bg-accent disabled:opacity-50 disabled:cursor-not-allowed text-white text-base font-bold rounded-2xl transition-colors"
        >
          <span
            class="ink-seal text-white w-5 h-5 text-[10px]"
            [class.ink-seal--pressed]="pressed()"
            (animationend)="pressed.set(false)"
          >V</span>
          {{ status() === 'submitting' ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <p class="text-center text-text2 text-xs mt-8">
        Authorised access only.
      </p>
    </section>
  </div>
</main>
