<app-auth-layout>
  <h1 class="text-2xl leading-8 font-semibold">Sign in</h1>
  <p class="muted mt-1">Use your studio admin account.</p>

  <form (ngSubmit)="submit()" class="mt-8 space-y-5" novalidate>
    <div>
      <label for="email" class="field-label">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        autocomplete="username"
        class="input min-h-11"
        placeholder="you@vamaha.tech"
        [attr.aria-invalid]="status() === 'error' ? 'true' : null"
        aria-describedby="login-error"
      />
    </div>

    <div>
      <div class="flex items-baseline justify-between">
        <label for="password" class="field-label">Password</label>
        <a routerLink="/forgot-password" [queryParams]="email ? { email: email.trim() } : {}" class="text-sm font-medium text-primary hover:underline">Forgot password?</a>
      </div>
      <div class="relative">
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          class="input min-h-11 pr-12"
          [attr.aria-invalid]="status() === 'error' ? 'true' : null"
          aria-describedby="login-error"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
          class="icon-btn absolute right-1 top-1/2 -translate-y-1/2"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
        </button>
      </div>
    </div>

    <p id="login-error" class="field-error flex items-center gap-1.5 min-h-[18px]" role="alert">
      @if (error()) {
        <app-icon name="alert-triangle" [size]="14" />
        {{ error() }}
      }
    </p>

    <button
      type="submit"
      class="btn w-full min-h-11"
      [disabled]="status() === 'submitting' || !email || !password"
    >
      @if (status() === 'submitting') {
        <app-icon name="loader" [size]="16" class="animate-spin motion-reduce:animate-none" />
        Signing in…
      } @else {
        Sign in
        <app-icon name="arrow-right" [size]="16" />
      }
    </button>
  </form>
</app-auth-layout>
