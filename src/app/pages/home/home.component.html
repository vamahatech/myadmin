<div class="min-h-screen bg-bg text-text flex flex-col">
  <app-global-header [contained]="true" />

  @if (!loading()) {
    <main class="flex-1 w-full max-w-[1280px] mx-auto px-4 sm:px-6 md:px-8 lg:px-12 xl:px-16 pt-10 sm:pt-12 pb-12">
      <h1 class="font-sans text-[28px] leading-[34px] sm:text-[32px] sm:leading-[38px] font-semibold tracking-[-0.01em]">
        Studio applications
      </h1>
      <p class="mt-2 text-sm text-text2">One place to manage every application shipped by the studio.</p>
      <p class="mt-3">
        <span class="inline-flex items-center rounded-full bg-surface px-2.5 py-0.5 text-xs font-medium text-text">
          {{ countLabel }}
        </span>
      </p>

      <ul class="mt-8 border border-border rounded-xl overflow-hidden divide-y divide-border" aria-label="Studio applications">
        @for (app of apps; track app.id; let i = $index) {
          <li class="ledger-row [&:first-child_a]:rounded-t-xl [&:last-child_a]:rounded-b-xl" [style.animation-delay]="(i * 60) + 'ms'">
            <app-row [app]="app" [index]="i" />
          </li>
        }
      </ul>

      <p class="mt-6 text-xs leading-[18px] text-text2">A focused workspace for the studio's applications.</p>
    </main>
  }
</div>
