<div class="min-h-screen bg-bg text-text flex flex-col">
  <app-global-header [contained]="true" />

  <main class="flex-1 w-full max-w-[1280px] mx-auto px-4 sm:px-6 md:px-8 lg:px-12 xl:px-16 pt-10 sm:pt-12 pb-12">
    <a routerLink="/" class="btn btn-tertiary btn-sm -ml-3 mb-4">
      <app-icon name="arrow-left" [size]="16" />
      All applications
    </a>

    <div class="page max-w-md">
      <app-page-header title="Account" description="Your studio console sign-in." />

      <div class="card p-6 space-y-5">
        @if (auth.user(); as u) {
          <dl class="grid grid-cols-[80px_1fr] gap-y-2 text-sm">
            <dt class="text-text2">Name</dt><dd class="text-text break-words">{{ u.name }}</dd>
            <dt class="text-text2">Email</dt><dd class="text-text break-all">{{ u.email }}</dd>
            <dt class="text-text2">Role</dt><dd class="text-text">{{ u.role }}</dd>
          </dl>
        }
        <button type="button" (click)="logout()" class="btn btn-secondary w-full">
          <app-icon name="log-out" [size]="16" />
          Sign out
        </button>
      </div>
    </div>
  </main>
</div>
