<div class="min-h-screen md:h-screen flex flex-col bg-bg text-text">
  <app-global-header [app]="app" [navOpen]="navOpen()" (navToggle)="navOpen.set(!navOpen())" />

  <div class="flex-1 min-h-0 flex">
    <app-sidebar
      [items]="navItems"
      [basePath]="basePath"
      [appName]="app?.name ?? appName"
      [open]="navOpen()"
      (closed)="navOpen.set(false)" />

    <main class="flex-1 min-w-0 md:h-full md:overflow-y-auto shell-content" [class]="contentClass ?? ''">
      <router-outlet />
    </main>
  </div>
</div>
