@if (open()) {
  <div class="fixed inset-0 z-40 bg-black/30 md:hidden" (click)="closed.emit()" aria-hidden="true"></div>
}

<aside
  id="app-sidebar"
  class="bg-bg border-r border-border flex flex-col
         fixed inset-y-0 left-0 z-50 w-[280px] max-w-[85vw] transition-transform duration-200 motion-reduce:transition-none
         md:static md:z-auto md:w-60 md:max-w-none md:translate-x-0 md:h-full md:shrink-0"
  [class]="open() ? 'translate-x-0' : '-translate-x-full invisible md:visible'"
  [attr.aria-label]="appName() + ' navigation'">
  <div class="md:hidden h-16 px-4 flex items-center justify-between border-b border-border shrink-0">
    <span class="text-sm font-semibold text-text">{{ appName() }}</span>
    <button type="button" class="icon-btn w-11 h-11" (click)="closed.emit()" aria-label="Close navigation">
      <app-icon name="x" />
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto px-3 py-4">
    <ul class="flex flex-col gap-1">
      @for (item of items(); track item.path) {
        @let active = isActive(item);
        <li>
          <a
            [routerLink]="link(item)"
            (click)="closed.emit()"
            [attr.aria-current]="active ? 'page' : null"
            class="relative flex items-center gap-3 h-10 px-3 rounded-lg text-sm transition-colors duration-150 motion-reduce:transition-none focus-visible:outline focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-focus"
            [class]="active
              ? 'bg-hover text-text font-semibold'
              : 'text-text2 font-medium hover:bg-hover hover:text-text active:bg-pressed'">
            @if (active) {
              <span class="absolute left-0 top-2 bottom-2 w-[3px] rounded-full bg-primary" aria-hidden="true"></span>
            }
            <app-icon [name]="item.icon" [size]="18" [class]="active ? 'text-primary' : 'text-text2'" />
            <span class="truncate">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
