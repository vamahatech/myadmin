<button
  #trigger
  type="button"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  aria-controls="app-switcher-panel"
  aria-haspopup="true"
  [attr.aria-label]="'Current application: ' + current().name + '. Switch application'"
  class="flex items-center gap-2 min-h-11 min-w-0 rounded-lg border border-border bg-card pl-1.5 pr-2 shadow-sm transition-colors duration-150 motion-reduce:transition-none hover:border-text2/40 active:bg-pressed focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">
  <span class="relative shrink-0">
    <img [src]="'/' + current().icon" alt="" class="w-7 h-7 rounded-md object-cover ring-1 ring-border" />
    <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full ring-2 ring-card" [style.background]="current().accentColor" aria-hidden="true"></span>
  </span>
  <span class="text-sm font-semibold text-text truncate">{{ current().name }}</span>
  <app-icon name="chevrons-up-down" [size]="16" class="text-text2" />
</button>

@if (open()) {
  <div
    id="app-switcher-panel"
    class="absolute left-0 top-full mt-2 w-80 max-w-[calc(100vw-32px)] z-40 rounded-xl border border-border bg-card shadow-md p-1.5">
    <p class="px-2.5 pt-1.5 pb-2 text-[11px] font-medium uppercase tracking-wide text-text2">Switch application</p>
    @for (app of apps; track app.id) {
      @let isCurrent = app.id === current().id;
      <a
        [routerLink]="app.route"
        (click)="close()"
        [attr.aria-current]="isCurrent ? 'true' : null"
        class="flex items-center gap-3 min-h-14 px-2.5 py-2 rounded-lg hover:bg-hover active:bg-pressed focus-visible:outline focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-focus"
        [class.bg-hover]="isCurrent">
        <img [src]="'/' + app.icon" alt="" class="w-9 h-9 shrink-0 rounded-lg object-cover ring-1 ring-border" />
        <span class="flex-1 min-w-0">
          <span class="flex items-center gap-1.5 text-sm text-text" [class.font-semibold]="isCurrent" [class.font-medium]="!isCurrent">
            <span class="w-1.5 h-1.5 rounded-full shrink-0" [style.background]="app.accentColor" aria-hidden="true"></span>
            <span class="truncate">{{ app.name }}</span>
          </span>
          <span class="block text-xs leading-[18px] text-text2 truncate">{{ app.tagline }}</span>
        </span>
        @if (isCurrent) {
          <app-icon name="check" [size]="16" class="text-primary" />
        }
      </a>
    }
    <div class="border-t border-border mt-1.5 pt-1.5">
      <a
        routerLink="/"
        (click)="close()"
        class="flex items-center gap-3 min-h-11 px-2.5 rounded-lg text-sm text-text hover:bg-hover active:bg-pressed focus-visible:outline focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-focus">
        <app-icon name="apps" [size]="16" class="text-text2" />
        All applications
      </a>
    </div>
  </div>
}
