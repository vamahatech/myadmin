<header class="border-b border-border bg-bg">
  <div
    class="h-16 flex items-center justify-between gap-3"
    [class]="contained() ? 'max-w-[1280px] mx-auto px-4 sm:px-6 md:px-8 lg:px-12 xl:px-16' : 'px-4 md:px-6 xl:px-8'">
    <div class="flex items-center gap-1 sm:gap-2 min-w-0">
      @if (app()) {
        <button
          type="button"
          (click)="navToggle.emit()"
          [attr.aria-expanded]="navOpen()"
          aria-controls="app-sidebar"
          aria-label="Open navigation"
          class="icon-btn md:hidden w-11 h-11 -ml-2">
          <app-icon name="menu" />
        </button>
      }

      <a
        routerLink="/"
        class="flex items-center gap-3 min-h-11 min-w-0 shrink-0 rounded-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-focus"
        [attr.aria-label]="app() ? 'Vamaha Tech — all applications' : null">
        <img src="/vamaha.svg" alt="" class="w-8 h-8 shrink-0" />
        <span class="leading-tight min-w-0" [class]="app() ? 'hidden lg:block' : 'block'">
          <span class="block text-sm leading-5 font-semibold text-text truncate">Vamaha Tech</span>
          <span class="block text-[11px] leading-4 font-medium uppercase tracking-[0.12em] text-text2">Studio console</span>
        </span>
      </a>

      @if (app(); as a) {
        <span class="text-border text-xl font-light select-none mx-1 hidden sm:inline" aria-hidden="true">/</span>
        <app-switcher [current]="a" />
      }
    </div>

    <app-account-menu />
  </div>
</header>
