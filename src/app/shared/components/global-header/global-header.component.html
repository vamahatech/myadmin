<header class="bg-surface" [class.border-b]="!app()" [class.border-border]="!app()">
  <div class="h-16 px-[var(--page-px)] md:pl-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-1 sm:gap-2 min-w-0">
      @if (app()) {
        <button
          type="button"
          (click)="navToggle.emit()"
          [attr.aria-expanded]="navOpen()"
          aria-controls="app-sidebar"
          aria-label="Open navigation"
          class="icon-btn md:hidden w-11 h-11 -ml-2">
          <app-icon name="menu" />
        </button>
      }

      <a
        routerLink="/"
        class="flex items-center gap-3 min-h-11 min-w-0 shrink-0 rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-focus"
        aria-label="Vamaha Tech studio console — all applications">
        <!-- Full wordmark (not the square app icon), so the studio reads as the
             platform. Inside an app on phones only the V shows, to leave room
             for the switcher. -->
        <span class="block h-7 overflow-hidden shrink-0" [class]="app() ? 'w-9 sm:w-[138px]' : 'w-[138px]'" aria-hidden="true">
          <img src="/vamaha-wordmark.png" alt="" class="wordmark-light h-7 w-auto max-w-none" />
          <img src="/vamaha-wordmark-dark.png" alt="" class="wordmark-dark h-7 w-auto max-w-none" />
        </span>
      </a>

      @if (app(); as a) {
        <app-icon name="chevron-right" [size]="16" class="text-text2 mx-0.5 hidden sm:inline-flex" />
        <app-switcher [current]="a" />
      }
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <!-- Command palette trigger: a search field on wide screens, an icon on phones. -->
      <button
        type="button"
        (click)="palette.show()"
        aria-haspopup="dialog"
        aria-label="Search apps, pages and actions"
        class="hidden md:flex items-center gap-2 h-10 w-64 lg:w-72 pl-3 pr-2 rounded-lg border border-border bg-card text-sm text-text2 hover:border-text2/40 transition-colors duration-150 motion-reduce:transition-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">
        <app-icon name="search" [size]="16" />
        <span class="flex-1 text-left">Search…</span>
        <kbd class="kbd">{{ shortcut }}</kbd>
      </button>
      <button type="button" (click)="palette.show()" class="icon-btn md:hidden w-11 h-11" aria-label="Search apps, pages and actions">
        <app-icon name="search" />
      </button>
      <app-account-menu />
    </div>
  </div>
</header>
