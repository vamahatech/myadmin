@if (visible()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-bg/70 backdrop-blur-[1px]"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <span class="sr-only">Loading…</span>
    <div class="loading-dual-ring" aria-hidden="true"></div>
  </div>
}
