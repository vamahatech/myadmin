<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vamaha Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Manrope:wght@400..800&family=Hind:wght@400;500;600;700&display=swap">
  <!-- Apply the saved theme before first paint (ThemeService takes over after boot). -->
  <script>
    (function () {
      var p = 'system';
      try { p = localStorage.getItem('vamaha_admin_theme') || 'system'; } catch (e) {}
      if (p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="bg-bg text-text">
  <app-root></app-root>
</body>
</html>
